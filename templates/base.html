<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TagClip{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}">TagClip</a>
    <nav>
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">一覧</a>
      <a href="{{ url_for('add') }}" class="{{ 'active' if request.endpoint == 'add' }}">登録</a>
      <a href="{{ url_for('tags') }}" class="{{ 'active' if request.endpoint in ('tags', 'ranking') }}">タグ</a>
      <a href="{{ url_for('settings') }}" class="{{ 'active' if request.endpoint in ('settings', 'settings_test') }}">設定</a>
    </nav>
  </header>

  <div id="status-bar" class="status-bar" data-pending="{{ counts.pending }}" {% if not counts.pending %}hidden{% endif %}>
    <span id="status-text">⏳ タグを取得中… 残り {{ counts.pending }} 件</span>
    <a id="status-reload" href="" hidden>再読み込み</a>
  </div>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="flash flash-{{ category }}">{{ message }}</p>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
